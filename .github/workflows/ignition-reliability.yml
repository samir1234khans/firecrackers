name: Ignition reliability
on:
  push:
    branches: [fix/ignition-reliability]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ignition-reliability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real desktop and touchscreen ignition
        run: node tests/live-ignition.mjs
      - name: Save rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ignition-evidence
          path: ignition-evidence/
          retention-days: 14
