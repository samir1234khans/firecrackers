name: Reconcile V4 motion-control check
on:
  push:
    branches: [feat/cinematic-atmosphere-v4]
    paths: [.github/workflows/cinematic-v4-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinematic-atmosphere-v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply bounded review corrections
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx');t=p.read_text();anchor='  const state = world.snapshot;'
          assert t.count(anchor)==1
          t=t.replace(anchor,anchor+'\n  const motionBlocked = prefs.reducedMotion || state.reducedMotion;')
          lines=t.splitlines()
          for i,line in enumerate(lines):
              if "label='Gentle camera response'" in line: lines[i]=line.replace('state.reducedMotion','motionBlocked')
          p.write_text('\n'.join(lines)+'\n')
          p=Path('tests/cinematic-v4-browser.mjs');t=p.read_text();old="getByRole('button',{name:'Night studio',exact:true})";assert t.count(old)==1;t=t.replace(old,"getByRole('button',{name:'Open night studio',exact:true})");p.write_text(t)
          PY
          git diff --check
      - run: npm ci
      - run: npm run typecheck
      - name: Commit only reviewed application and test changes
        run: |
          test "$(git ls-remote origin refs/heads/feat/cinematic-atmosphere-v4 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx tests/cinematic-v4-browser.mjs
          git commit -m 'fix: apply motion preference immediately and use the actual Studio entry in regression'
          git push origin HEAD:refs/heads/feat/cinematic-atmosphere-v4
