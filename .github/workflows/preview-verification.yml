name: Deployed preview source verification
on:
  workflow_dispatch:
  push:
    branches: [feat/fireworks-v1]
    paths:
      - .github/workflows/preview-verification.yml
      - scripts/verify-preview.mjs
      - scripts/generate-release.mjs
      - tests/release-fingerprint.test.mjs
permissions:
  contents: read
jobs:
  verify-public-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install the pinned source parser without running install scripts
        run: npm ci --ignore-scripts
      - name: Verify that only static host labels are excluded
        run: node --test tests/release-fingerprint.test.mjs
      - name: Compute the application source fingerprint
        run: node scripts/generate-release.mjs
      - name: Verify the actual public deployment against this commit
        run: node scripts/verify-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-preview-verification
          path: test-results/deployed-source-parity.json
          retention-days: 7
          if-no-files-found: error
