name: Refine experience candidate
on:
  push:
    branches: [feat/richer-night-experience]
    paths: [.github/workflows/experience-refine.yml]
permissions:
  contents: write
concurrency:
  group: experience-refinement
  cancel-in-progress: false
jobs:
  refine:
    if: github.ref == 'refs/heads/feat/richer-night-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply checksum-verified source-only refinements
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/experience-refined
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma
          patch=lzma.decompress(base64.b64decode(Path('.github/experience-refinement.txt').read_text().strip(),validate=True))
          assert hashlib.sha256(patch).hexdigest() == '67c3de0c61fec061749adf2b54d8c730f2b2d55f5de32cfed90c200a56746544'
          Path('/tmp/experience-refined/source.patch').write_bytes(patch)
          PY
          git apply --check /tmp/experience-refined/source.patch
          git apply --index /tmp/experience-refined/source.patch
          npm uninstall --save-dev --package-lock-only --ignore-scripts --no-audit tailwindcss
          npm update serialize-javascript --package-lock-only --ignore-scripts --no-audit
          test -z "$(git diff "$GITHUB_SHA" --name-only -- .github/workflows)"
          git diff --check
      - run: npm ci
      - name: Type, unit, lint, build, documentation and security gates
        id: checks
        run: |
          set +e
          status=0
          for task in 'npm test' 'npm run typecheck' 'npm run lint' 'npm run build' 'python3 scripts/validate_docs.py' 'npm audit --audit-level=high'; do
            name=$(echo "$task" | tr ' /' '--')
            bash -c "$task" > "/tmp/experience-refined/$name.log" 2>&1
            code=$?
            echo "$task: exit $code"
            tail -18 "/tmp/experience-refined/$name.log"
            grep -A30 'not ok' "/tmp/experience-refined/$name.log" || true
            if [ "$code" != 0 ]; then status=1; fi
          done
          npm audit --json > /tmp/experience-refined/audit.json
          test -f dist/index.html && echo 'built=true' >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Checkpoint only on the feature branch
        run: |
          test "$(git ls-remote origin refs/heads/feat/richer-night-experience | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs AGENTS.md README.md PROJECT_STATUS.md DEVELOPMENT.md package.json package-lock.json
          git commit -m 'fix: retain personal drafts, correct Encore lifecycle and harden capture cleanup'
          git push origin HEAD:refs/heads/feat/richer-night-experience
          git rev-parse HEAD > /tmp/experience-refined/SOURCE_COMMIT.txt
          cp package.json package-lock.json /tmp/experience-refined/
      - name: Install browser
        if: always() && steps.checks.outputs.built == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify desktop and phone creative and capture journeys
        if: always() && steps.checks.outputs.built == 'true'
        run: |
          npm run preview -- --port 4173 > /tmp/experience-refined/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          set +e
          node tests/experience-browser.mjs /tmp/experience-refined/browser
          result=$?
          node -e "const r=require('/tmp/experience-refined/browser/report.json');for(const c of r.cases)console.log(JSON.stringify({name:c.name,pass:c.pass,checks:c.checks,failure:c.failure,errors:c.errors,consoleErrors:c.consoleErrors,photo:c.photo,video:c.video}));"
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-refined-evidence
          path: /tmp/experience-refined
          retention-days: 14
