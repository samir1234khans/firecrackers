name: Video flow verification
on:
  push:
    branches: [fix/video-launch-flow]
permissions:
  contents: read
concurrency:
  group: video-flow-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Prepare portable verification environment
        run: |
          mkdir -p /tmp/video-flow-evidence
          git archive --format=tar HEAD | gzip > /tmp/video-flow-evidence/source.tar.gz
          tar -czf /tmp/video-flow-evidence/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/video-flow-evidence/SOURCE_COMMIT.txt
      - name: Validate video repairs when present
        run: |
          if [ -f tests/video-flow.test.mjs ]; then
            npm run typecheck
            npm run lint
            npm test
            npm run build
            node --test tests/video-flow.test.mjs
            npx playwright install --with-deps chromium
            node tests/video-flow-browser.mjs /tmp/video-flow-evidence
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-flow-evidence
          path: /tmp/video-flow-evidence/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
