name: Video flow standalone verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run test:video-flow
      - run: node --test tests/release-fingerprint.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/video-flow-browser.mjs /tmp/video-flow-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-flow-evidence
          path: /tmp/video-flow-evidence/
          retention-days: 7
          compression-level: 0
