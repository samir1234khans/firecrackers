name: Published viewability and launch verification
on:
  push:
    branches: [fix/viewability-recovery]
    paths: [.github/workflows/viewability-live.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firecrackers-viewability-live
  cancel-in-progress: true
jobs:
  source-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Verify the public release receipt against this exact source
        run: |
          node --test tests/release-fingerprint.test.mjs
          node scripts/generate-release.mjs
          node scripts/verify-preview.mjs
      - run: npx playwright install --with-deps chromium
      - name: Published viewports and injected recovery failures
        env:
          VIEWABILITY_URL: https://firecrackers-a93nle.v2.appdeploy.ai/
        run: node tests/viewability-browser.mjs test-results/live-viewability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-viewability-evidence
          path: test-results/
          retention-days: 7
  desktop-and-mobile-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Published full launch sequence and retained platform workflows
        env:
          VIDEO_FLOW_URL: https://firecrackers-a93nle.v2.appdeploy.ai/
        run: node tests/video-flow-browser.mjs test-results/live-launch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-launch-evidence
          path: test-results/
          retention-days: 7
