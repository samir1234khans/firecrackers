name: Video flow live verification
on:
  push:
    branches: [fix/video-launch-flow]
    paths:
      - .github/workflows/video-flow-live.yml
permissions:
  contents: read
concurrency:
  group: video-flow-live
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Compare public source receipt with this exact source
        run: |
          mkdir -p /tmp/video-flow-live
          node scripts/generate-release.mjs
          node --input-type=module - <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const expected = JSON.parse(await readFile('public/release.json', 'utf8'));
          const response = await fetch('https://firecrackers-a93nle.v2.appdeploy.ai/release.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Public receipt HTTP ' + response.status);
          const actual = await response.json();
          const mismatchedModules = expected.modules.filter(e => !actual.modules.some(a => a.path === e.path && a.sha256 === e.sha256)).map(e => e.path);
          const result = { checkedAt: new Date().toISOString(), sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), url: 'https://firecrackers-a93nle.v2.appdeploy.ai/', version: actual.version, expectedSha256: expected.sha256, actualSha256: actual.sha256, moduleCount: expected.modules.length, mismatchedModules, matches: expected.sha256 === actual.sha256 && actual.version === '2026-09-21.2', normalization: expected.normalization, scope: expected.scope };
          await writeFile('/tmp/video-flow-live/source-parity.json', JSON.stringify(result, null, 2));
          await writeFile('/tmp/video-flow-live/public-release.json', JSON.stringify(actual, null, 2));
          console.log(JSON.stringify(result, null, 2));
          if (!result.matches) process.exitCode = 1;
          JS
      - run: npx playwright install --with-deps chromium
      - name: Run actual published desktop and mobile workflows
        env:
          VIDEO_FLOW_URL: https://firecrackers-a93nle.v2.appdeploy.ai/
        run: node tests/video-flow-browser.mjs /tmp/video-flow-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-flow-live-evidence
          path: /tmp/video-flow-live/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
