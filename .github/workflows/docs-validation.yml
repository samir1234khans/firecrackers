name: Documentation validation

on:
  push:
    paths:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - 'design/**'
      - 'scripts/**'
      - '.github/workflows/docs-validation.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'specs/**'
      - 'design/**'
      - 'scripts/**'
      - '.github/workflows/docs-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-09-15
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7, verified 2026-09-15
        with:
          python-version: '3.12'
      - name: Install documentation-only validator dependencies
        run: python -m pip install -r scripts/requirements-docs.txt
      - name: Validate links, requirements, and configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/validate_docs.py | tee reports/documentation-validation.txt
          python --version >> reports/documentation-validation.txt
          python -m pip show jsonschema >> reports/documentation-validation.txt
          git rev-parse HEAD >> reports/documentation-validation.txt
      - name: Package the documentation source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          git archive --format=zip --prefix=Firecrackers_Documentation/ \
            --output=export/Firecrackers_Documentation.zip HEAD \
            README.md AGENTS.md DEVELOPMENT.md PROJECT_STATUS.md \
            docs specs design scripts .github/workflows/docs-validation.yml
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json, subprocess
          archive = Path('export/Firecrackers_Documentation.zip')
          metadata = {
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'scope': 'Documentation/configuration only; application tests remain unrun',
              'validationLog': 'documentation-validation.txt'
          }
          with ZipFile(archive, 'a', compression=ZIP_DEFLATED) as z:
              z.write('reports/documentation-validation.txt', 'Firecrackers_Documentation/documentation-validation.txt')
              z.writestr('Firecrackers_Documentation/package-metadata.json', json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Upload the validated documentation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, verified 2026-09-15
        with:
          name: firecrackers-documentation
          path: export/Firecrackers_Documentation.zip
          if-no-files-found: error
          retention-days: 30
