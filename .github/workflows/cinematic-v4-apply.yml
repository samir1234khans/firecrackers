name: Apply reviewed cinematic V4 source
on:
  workflow_dispatch:
  push:
    branches: [feat/cinematic-atmosphere-v4]
    paths: [.github/workflows/cinematic-v4-apply.yml]
permissions:
  contents: write
concurrency:
  group: cinematic-v4-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/cinematic-atmosphere-v4'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinematic-atmosphere-v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify and apply the exact application source patch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'scripts/v4-transfer-{i}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '748cf2651875fd3aec520ebd521d5c292e3dfdf12bc9f00186e221fc312f6abf', 'Source transfer mismatch'
          pathlib.Path('/tmp/v4-source.patch').write_bytes(patch)
          # The regression workflow was already written through the authorised connector.
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--unidiff-zero','--check','/tmp/v4-source.patch'],check=True)
          subprocess.run(['git','apply','--exclude=.github/workflows/*','--unidiff-zero','/tmp/v4-source.patch'],check=True)
          PY
          git diff --check
      - run: npm ci
      - run: npm run typecheck
      - name: Commit application source only to the candidate branch
        run: |
          rm scripts/v4-transfer-{0,1,2,3}.b64
          test "$(git ls-remote origin refs/heads/feat/cinematic-atmosphere-v4 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts tests docs README.md PROJECT_STATUS.md DEVELOPMENT.md package.json tsconfig.engine.json
          git diff --cached --check
          git commit -m 'feat: cinematic light, star evolution, atmosphere and deliberate watch experience'
          git push origin HEAD:refs/heads/feat/cinematic-atmosphere-v4
      - name: Verify source invariants and production build
        run: |
          npm test
          npm run lint
          npm run build
          python3 scripts/validate_docs.py
