name: Capture continuity regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/experience/SceneCapture.ts, tests/capture-stream.test.mjs, tests/capture-continuity-browser.mjs, tests/captured-media-helpers.mjs, .github/workflows/capture-continuity.yml]
  pull_request:
    paths: [src/experience/SceneCapture.ts, src/engine/useWorld.ts, tests/capture-stream.test.mjs, tests/capture-continuity-browser.mjs, tests/captured-media-helpers.mjs, package.json, .github/workflows/capture-continuity.yml]
permissions:
  contents: read
concurrency:
  group: capture-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: TypeScript and frame-delivery unit contracts
        run: |
          mkdir -p test-results/capture-continuity
          git rev-parse HEAD > test-results/capture-continuity/SOURCE.txt
          npx tsc -p tsconfig.engine.json
          node --test tests/capture-stream.test.mjs
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install independent media decoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Actual UI capture, presented pixels and multiple distinct decoded frames
        run: |
          npm run preview -- --port 4173 > test-results/capture-continuity/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          npm run test:capture-continuity -- test-results/capture-continuity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-continuity-evidence
          path: test-results/capture-continuity
          retention-days: 14
