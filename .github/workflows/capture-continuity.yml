name: Capture continuity diagnosis
on:
  workflow_dispatch:
  push:
    branches: [fix/capture-continuity]
    paths: [.github/workflows/capture-continuity.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5b75eec2245ef8baf0a54dd12a7b5df17a4e637b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Add bounded test-only draw tracing without modifying application code
        run: |
          mkdir -p test-results/continuity
          git rev-parse HEAD > test-results/continuity/SOURCE.txt
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/cinematic-integration-browser.mjs')
          text=path.read_text()
          old="      await page.getByRole('button', { name: 'Capture this night', exact: true }).click();"
          assert text.count(old)==1
          spy='''      await page.evaluate(() => {
            const original = HTMLCanvasElement.prototype.captureStream;
            HTMLCanvasElement.prototype.captureStream = function(...args) {
              const trace = { draws: 0, firstDraw: null, lastDraw: null, width: this.width, height: this.height };
              window.__captureTrace = trace;
              const context = this.getContext('2d'), draw = context.drawImage.bind(context);
              context.drawImage = (...values) => {
                trace.draws++; trace.firstDraw ??= performance.now(); trace.lastDraw = performance.now();
                return draw(...values);
              };
              return original.apply(this, args);
            };
          });'''
          text=text.replace(old,spy+'\n'+old)
          old='      await page.waitForTimeout(1500);'
          assert text.count(old)==1
          text=text.replace(old,"      entry.recordingBefore = await snap();\n"+old+"\n      entry.recordingAfter = await snap();\n      entry.captureTrace = await page.evaluate(() => window.__captureTrace);")
          text=text.replace('[[1280, 800], [393, 851]]','[[1280, 800]]')
          path.write_text(text)
          PY
          git diff -- tests > test-results/continuity/test-only-instrumentation.patch
          node --check tests/cinematic-integration-browser.mjs
      - name: Run actual desktop recording journeys and retain raw media
        run: |
          npm run preview -- --port 4173 > test-results/continuity/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          set +e
          npm run test:cinematic-integration -- test-results/continuity
          result=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('test-results/continuity/report.json').read_text())
          fields=['time','frames','paused','show','headCount','trailCount','active','phase','skyFrozen','capture']
          for c in report['cases']:
              print(json.dumps({'name':c['name'],'pass':c.get('pass'),'failure':c.get('failure'),'trace':c.get('captureTrace'),'before':{k:c.get('recordingBefore',{}).get(k) for k in fields},'after':{k:c.get('recordingAfter',{}).get(k) for k in fields},'media':c.get('capture')},indent=2))
          PY
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-continuity-diagnosis
          path: test-results/continuity
          retention-days: 14
