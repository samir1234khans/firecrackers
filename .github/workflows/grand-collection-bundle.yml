name: Grand collection source bundle
on:
  workflow_dispatch:
  push:
    branches: [feat/grand-collection]
    paths: [.github/workflows/grand-collection-bundle.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Export current tracked source and exact dependencies for delivery review
        run: |
          mkdir -p /tmp/grand-collection
          git archive HEAD | gzip > /tmp/grand-collection/source.tar.gz
          tar -czf /tmp/grand-collection/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/grand-collection/SOURCE_COMMIT.txt
          sha256sum package-lock.json > /tmp/grand-collection/LOCK_SHA256.txt
          node --version > /tmp/grand-collection/NODE_VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grand-collection-environment
          path: /tmp/grand-collection
          retention-days: 3
          compression-level: 0
