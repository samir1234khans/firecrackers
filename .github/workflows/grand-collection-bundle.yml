name: Grand collection source bundle
on:
  workflow_dispatch:
  push:
    branches: [feat/grand-collection, fix/full-sky-bursts-waterlight]
    paths: [.github/workflows/grand-collection-bundle.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Export a bounded local verification environment
        run: |
          mkdir -p /tmp/grand-collection
          python3 - <<'PY'
          import subprocess, tarfile
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('/tmp/grand-collection/source.tar.gz', 'w:gz') as archive:
              for path in files:
                  if path and not path.startswith(('docs/evidence/', 'assets-source/')):
                      archive.add(path, recursive=False)
          PY
          tar -czf /tmp/grand-collection/dependencies.tar.gz --exclude=node_modules/@cloudflare --exclude=node_modules/workerd --exclude=node_modules/wrangler node_modules
          git rev-parse HEAD > /tmp/grand-collection/SOURCE_COMMIT.txt
          sha256sum package-lock.json > /tmp/grand-collection/LOCK_SHA256.txt
          node --version > /tmp/grand-collection/NODE_VERSION.txt
          du -h /tmp/grand-collection/*
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-verification-environment
          path: /tmp/grand-collection
          retention-days: 3
          compression-level: 0
