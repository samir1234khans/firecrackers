name: Full night isolated edit and verification
on:
  workflow_dispatch:
  push:
    branches: [fix/full-sky-bursts-waterlight]
    paths: [.github/workflows/grand-collection-bundle.yml, scripts/apply-full-night.py, scripts/full-night-runner.py]
permissions:
  contents: write
concurrency:
  group: full-night-isolated-edit
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/full-sky-bursts-waterlight'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-sky-bursts-waterlight
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply guarded source changes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/full-night
          python3 scripts/full-night-runner.py
          git diff --check
          git diff -- src tests docs > /tmp/full-night/source.patch
      - run: npm ci
      - name: Typecheck before committing source
        run: npm run typecheck
      - name: Commit only to the isolated fix branch
        run: |
          test "$(git ls-remote origin refs/heads/fix/full-sky-bursts-waterlight | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs
          git commit -m 'fix: fuller sky-filling shells and shell-colored waterfront illumination'
          git push origin HEAD:refs/heads/fix/full-sky-bursts-waterlight
      - name: Unit, lint, build and documentation checks
        run: |
          set +e
          set -o pipefail
          npm test 2>&1 | tee /tmp/full-night/unit.log
          unit=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee /tmp/full-night/lint.log
          lint=${PIPESTATUS[0]}
          npm run build 2>&1 | tee /tmp/full-night/build.log
          build=${PIPESTATUS[0]}
          python3 scripts/validate_docs.py 2>&1 | tee /tmp/full-night/docs.log
          docs=${PIPESTATUS[0]}
          printf 'unit=%s lint=%s build=%s docs=%s\n' "$unit" "$lint" "$build" "$docs" | tee /tmp/full-night/result.txt
          test "$unit$lint$build$docs" = '0000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-night-validation
          path: /tmp/full-night
          retention-days: 7
