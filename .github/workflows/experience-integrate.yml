name: Integrate experience candidate
on:
  push:
    branches: [feat/richer-night-experience]
    paths: [.github/workflows/experience-integrate.yml]
permissions:
  contents: write
concurrency:
  group: integrate-experience-candidate
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/richer-night-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify source payload and reconcile reviewed full-night ancestry
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = 'feat/richer-night-experience'
          mkdir -p /tmp/experience
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          encoded = ''.join(Path(f'.github/experience-transfer/{i:02}.txt').read_text().strip() for i in range(5))
          assert len(encoded) == 48168, len(encoded)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 145445, len(patch)
          assert hashlib.sha256(patch).hexdigest() == 'a268dca3291b5d36052437dae15523c50dee5e9f45e01fb6219526c1f7ee87ad'
          Path('/tmp/experience/source.patch').write_bytes(patch)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin b75e3c59c5ddc995a2ff0c553267dacada2e3245
          git merge --no-ff -m 'Reconcile fuller shells and waterfront baseline from PR 36' b75e3c59c5ddc995a2ff0c553267dacada2e3245
          git apply --check --unidiff-zero /tmp/experience/source.patch
          git apply --index --unidiff-zero /tmp/experience/source.patch
          git diff --cached --check
      - run: npm ci
      - name: Validate source before the feature-branch checkpoint
        run: |
          npm run typecheck
          npm run lint
          node --check tests/experience-browser.mjs
          node --check tests/experience.test.mjs
      - name: Commit to the isolated feature branch only
        run: |
          test "$(git ls-remote origin refs/heads/feat/richer-night-experience | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'feat: richer smoke, sound, discovery, personal shows, replay and capture'
          git push origin HEAD:refs/heads/feat/richer-night-experience
          git rev-parse HEAD | tee /tmp/experience/SOURCE_COMMIT.txt
      - name: Complete unit, build and documentation checks
        id: checks
        run: |
          set +e
          status=0
          for task in 'npm test' 'npm run build' 'python3 scripts/validate_docs.py'; do
            name=$(echo "$task" | tr ' /' '--')
            bash -c "$task" > "/tmp/experience/$name.log" 2>&1
            code=$?
            echo "$task: exit $code"
            tail -20 "/tmp/experience/$name.log"
            grep -A30 'not ok' "/tmp/experience/$name.log" || true
            if [ "$code" != 0 ]; then status=1; fi
          done
          test -f dist/index.html && echo 'built=true' >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Prepare browser
        if: always() && steps.checks.outputs.built == 'true'
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile user journeys
        if: always() && steps.checks.outputs.built == 'true'
        run: |
          npm run preview -- --port 4173 > /tmp/experience/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          set +e
          node tests/experience-browser.mjs /tmp/experience/browser
          result=$?
          test ! -f /tmp/experience/browser/report.json || cat /tmp/experience/browser/report.json
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-integration-evidence
          path: /tmp/experience
          retention-days: 14
