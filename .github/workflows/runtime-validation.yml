name: Runtime validation
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths: ['src/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/runtime-validation.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run test:video-flow && node --test tests/release-fingerprint.test.mjs
      - run: npm run test:soak
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Documentation structure
        run: |
          python -m pip install -r scripts/requirements-docs.txt
          python scripts/validate_docs.py
      - run: npx playwright install --with-deps chromium
      - run: node tests/video-flow-browser.mjs test-results/video-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence-${{ github.sha }}
          path: |
            dist
            test-results
          retention-days: 7
          if-no-files-found: ignore
