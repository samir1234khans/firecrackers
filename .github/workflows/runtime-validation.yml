name: Runtime validation
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve the exact declared dependency set
        run: npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: package-lock.json
          retention-days: 7
  preserve-initial-lock:
    needs: dependencies
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/fireworks-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - name: Preserve resolved lock without changing or forcing other work
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/fireworks-v1
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'build: preserve resolved dependency lock for runtime implementation'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then echo 'Branch advanced; retaining lock artifact without overwriting work.'; exit 0; fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/$BRANCH"
  security-review:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit dependency graph
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const fs=require('node:fs');const a=JSON.parse(fs.readFileSync('npm-audit.json','utf8'));console.log(JSON.stringify(a,null,2));if(a.error)process.exit(2);if((a.metadata?.vulnerabilities?.high||0)+(a.metadata?.vulnerabilities?.critical||0)>0)process.exit(1);"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: npm-audit.json
          retention-days: 7
  verify:
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:soak
      - run: npm run build
      - name: Validate documentation
        run: |
          python -m pip install -r scripts/requirements-docs.txt
          python scripts/validate_docs.py
      - run: npx playwright install --with-deps chromium
      - name: Cinematic renderer gate
        run: npx playwright test tests/browser/v2.spec.ts --project=desktop-chromium --max-failures=1
      - run: npm run test:e2e
      - name: Preserve actual build and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ github.sha }}
          path: |
            dist
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
