name: Runtime validation
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.nvmrc'
      - 'index.html'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/runtime-validation.yml'
      - '.github/workflows/grand-collection-validation.yml'
      - '.github/workflows/cloudflare-release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/grand-collection-validation.yml
