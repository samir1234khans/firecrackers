name: Verify reviewed source

on:
  push:
    branches: [feat/fireworks-v1]
    paths: [.changes/reviewed-source.json]

permissions:
  contents: read

concurrency:
  group: reviewed-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact input hashes and materialize reviewed UTF-8 source
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path, PurePosixPath
          envelope = json.loads(Path('.changes/reviewed-source.json').read_text())
          raw = gzip.decompress(base64.b64decode(envelope['gzip_base64'], validate=True))
          assert len(raw) < 2000000
          assert hashlib.sha256(raw).hexdigest() == envelope['sha256']
          files = json.loads(raw)['files']
          assert 0 < len(files) < 100
          seen = set()
          for item in files:
              name = item['path']
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and name not in seen
              assert name.startswith(('src/', 'tests/', 'docs/evidence/')) or name in ('package.json', 'tsconfig.engine.json')
              seen.add(name)
              target = Path(name)
              before = hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
              assert before == item['before_sha256'], 'Source changed: ' + name
              assert hashlib.sha256(item['content'].encode()).hexdigest() == item['sha256']
          for item in files:
              target = Path(item['path']); target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(item['content'])
          Path('/tmp/reviewed-file-list.json').write_text(json.dumps([item['path'] for item in files]))
          print('Validated and materialized', len(files), 'reviewed source files')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npm run test:soak
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Renderer and presentation gate
        run: npx playwright test tests/browser/v2.spec.ts --project=desktop-chromium --max-failures=1
      - name: Complete desktop and mobile regression suite
        run: npm run test:e2e
      - name: Package only the verified source files
        run: |
          python - <<'PY'
          import json, tarfile
          from pathlib import Path
          names = json.loads(Path('/tmp/reviewed-file-list.json').read_text())
          with tarfile.open('/tmp/reviewed-source.tar.gz', 'w:gz') as archive:
              for name in names:
                  archive.add(name, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reviewed-source
          path: /tmp/reviewed-source.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-runtime-evidence
          path: |
            dist
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-source
          path: /tmp/reviewed
      - name: Publish verified source on the existing feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import tarfile
          with tarfile.open('/tmp/reviewed/reviewed-source.tar.gz') as archive:
              archive.extractall('.', filter='data')
          PY
          rm .changes/reviewed-source.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src tests docs/evidence package.json tsconfig.engine.json .changes/reviewed-source.json
          git commit -m 'feat: implement verified cinematic fireworks V2 runtime and regression tests'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin feat/fireworks-v1
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Branch advanced. Verified source retained as an artifact; no overwrite attempted.'
            exit 1
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/fireworks-v1
