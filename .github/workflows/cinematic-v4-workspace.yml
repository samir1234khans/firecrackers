name: Cinematic V4 workspace
on:
  workflow_dispatch:
  push:
    branches: [feat/cinematic-atmosphere-v4]
    paths: [.github/workflows/cinematic-v4-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Export bounded source and verification dependencies
        run: |
          mkdir -p /tmp/cinematic-v4
          python3 - <<'PY'
          import subprocess, tarfile, io, json
          refs = {'main': 'a1202af5fa1955eab844988a1f1ff32299fb8579', 'held': '5fbb45b2d9d1ee3463cee232f3f3bdc937255e01', 'base': '61c41165ef099675c2e709313c0e47e02cdbd061'}
          for name, ref in refs.items():
              paths = subprocess.check_output(['git','ls-tree','-r','--name-only',ref]).decode().splitlines()
              with tarfile.open('/tmp/cinematic-v4/'+name+'.tar.gz','w:gz') as archive:
                  for path in paths:
                      if path.startswith(('docs/evidence/','assets-source/')): continue
                      if name != 'main' and not (path.startswith(('src/','tests/','scripts/','public/music/')) or path in ('package.json','vite.config.ts','index.html')): continue
                      data = subprocess.check_output(['git','show',ref+':'+path])
                      info = tarfile.TarInfo(path); info.size=len(data); info.mode=0o644
                      archive.addfile(info,io.BytesIO(data))
          with open('/tmp/cinematic-v4/refs.json','w') as f: json.dump(refs,f,indent=2)
          PY
          tar -czf /tmp/cinematic-v4/dependencies.tar.gz --exclude=node_modules/@cloudflare --exclude=node_modules/workerd --exclude=node_modules/wrangler node_modules
          node --version > /tmp/cinematic-v4/node-version.txt
          sha256sum package-lock.json > /tmp/cinematic-v4/lock.sha256
          curl --max-time 20 -fsS -D /tmp/cinematic-v4/production.headers https://firecrackers.mainandmany.com/release.json -o /tmp/cinematic-v4/production.json || true
          curl --max-time 20 -fsS -D /tmp/cinematic-v4/preview.headers https://firecrackers-shows-preview.allygym-api.workers.dev/release.json -o /tmp/cinematic-v4/preview.json || true
          du -h /tmp/cinematic-v4/*
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-v4-workspace
          path: /tmp/cinematic-v4
          retention-days: 3
          compression-level: 0
