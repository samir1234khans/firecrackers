<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03050b" />
    <meta name="description" content="A night sky of your own. Choose a firework, light its fuse, and watch realistic festival fireworks unfold." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Firecrackers</title>
    <style>
      html,body{margin:0;background:#040a14;color:#e9ecf1;font-family:system-ui,sans-serif}
      .boot-shell{box-sizing:border-box;position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));max-height:calc(100dvh - 24px);overflow:auto;padding:16px;background:rgba(8,15,24,.78);border:0;border-radius:12px;text-align:left}
      .boot-label{color:#e5bd80;font-size:12px;margin:0 0 8px}
      .boot-shell h1{font:600 18px/1.3 system-ui,sans-serif;margin:0 0 8px}
      .boot-shell p{font-size:14px;line-height:1.5;color:#bac5d2}
      .boot-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
      .boot-actions[hidden]{display:none}
      .boot-actions a,.boot-actions button{box-sizing:border-box;display:inline-flex;align-items:center;background:transparent;color:#f0d09a;min-height:48px;border:0;border-radius:6px;padding:8px;text-decoration:none;font:500 14px/1.4 system-ui;cursor:pointer}
      .boot-actions a:hover,.boot-actions button:hover{background:#e5bd8014}
      .boot-actions a:focus-visible,.boot-actions button:focus-visible{outline:2px solid #f0d09a;outline-offset:2px}
    </style>
  </head>
  <body>
    <div id="root">
      <section class="boot-shell" id="boot-shell" role="status">
        <p class="boot-label">Firecrackers</p>
        <h1>Preparing the night sky</h1>
        <p id="boot-message">Opening your sky…</p>
        <div id="boot-recovery" class="boot-actions">
          <a href="./">Reload website</a>
          <a href="?backend=canvas">Open compatibility mode</a>
        </div>
      </section>
    </div>
    <noscript>This interactive fireworks simulation needs JavaScript. It uses no accounts or tracking.</noscript>
    <script type="module" src="./src/bootstrap.ts"></script>
  </body>
</html>
